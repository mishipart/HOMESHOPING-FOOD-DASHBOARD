<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>홈쇼핑 식품 모니터</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div>
        <div class="eyebrow">HOMESHOPPING FOOD MONITOR</div>
        <h1>홈쇼핑 식품 모니터</h1>
        <p id="updatedAt" class="subtle">데이터를 불러오는 중입니다.</p>
      </div>
      <div class="top-actions">
        <button id="todayBtn" class="btn secondary" type="button">오늘</button>
        <button id="refreshBtn" class="btn primary" type="button">데이터 새로고침</button>
      </div>
    </header>

    <section id="kpiRoot" class="kpi-grid" aria-label="핵심 지표"></section>

    <nav class="tabs" aria-label="대시보드 메뉴">
      <button class="tab active" data-tab="calendar" type="button">캘린더</button>
      <button class="tab" data-tab="performance" type="button">실적 상세</button>
      <button class="tab" data-tab="review" type="button">상품 확인</button>
      <button class="tab" data-tab="watch" type="button">관심상품</button>
    </nav>

    <section id="viewRoot"></section>

    <footer class="footer">
      <span>홈쇼핑 식품 모니터 V2.6.1</span>
      <span id="rowCount"></span>
    </footer>
  </main>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>

  <script src="./app.js"></script>
</body>
</html>
